name: preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@5a81b1ac6081babf702713afb497d5a4f5c662bf # v1.0.0
    with:
      kind: image
      on-main: true
      images: '[{"name":"mock-api","dockerfile":"Dockerfile","context":"."}]'
    permissions:
      contents: read
      packages: write
